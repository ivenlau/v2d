name: Chrome Build

# 手动触发，或打 tag 时出包（同时跑测试作为门禁）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 测试与类型检查
        run: |
          pnpm test
          pnpm compile

      - name: 构建 Chrome MV3
        run: pnpm build

      - name: 打包
        run: |
          cd .output/chrome-mv3
          zip -qry ../../v2d-chrome-mv3.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: v2d-chrome-mv3
          path: v2d-chrome-mv3.zip
