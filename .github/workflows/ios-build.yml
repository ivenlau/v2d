name: iOS Build

# 手动触发，或在打 tag 时自动出包
# includes_app_group = true 时启用 App Group entitlement（需付费开发者账号）
on:
  workflow_dispatch:
    inputs:
      includes_app_group:
        description: '启用 App Group（需付费开发者账号）'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14
    env:
      APP_GROUP_FLAG: ${{ github.event.inputs.includes_app_group == 'true' && 'group' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Safari 扩展（MV3）
        run: pnpm exec wxt build -b safari --mv3

      - name: 转换为 Xcode 工程
        run: |
          xcrun safari-web-extension-converter .output/safari-mv3 \
            --project-location .output/ios \
            --app-name "V2D" \
            --bundle-identifier "com.ivenlau.v2d" \
            --ios-only \
            --no-open --no-prompt
          echo "── 转换产物 ──"
          find .output/ios -maxdepth 3 | head -20

      - name: 注入自定义 Swift/Entitlements
        run: |
          VC=$(find .output/ios -name "ViewController.swift" | head -1)
          [ -n "$VC" ] && cp ios/ViewController.swift "$VC" && echo "Injected: $VC"
          HANDLER=$(find .output/ios -name "SafariWebExtensionHandler.swift" | head -1)
          [ -n "$HANDLER" ] && cp ios/SafariWebExtensionHandler.swift "$HANDLER" && echo "Injected: $HANDLER"
          # App Group entitlements 仅在付费构建时注入（勾选 includes_app_group）
          if [ "${{ github.event.inputs.includes_app_group }}" = "true" ]; then
            ENT_DIR=$(dirname "$VC")
            cp ios/V2D.entitlements "$ENT_DIR/V2D.entitlements"
            echo "App Group entitlements 已注入 → $ENT_DIR/V2D.entitlements"
          fi
          echo "── 转换产物目录树 ──"
          find .output/ios -maxdepth 3 -type f -name "*.swift" -o -name "*.entitlements" | head -20

      - name: 编译（未签名）
        run: |
          PROJ=$(find .output/ios -name "*.xcodeproj" -maxdepth 3 | head -1)
          echo "project: $PROJ"
          PROJ_NAME=$(basename "$PROJ")
          PROJ_DIR=$(dirname "$PROJ")
          cd "$PROJ_DIR"
          xcodebuild -list -project "$PROJ_NAME"
          SCHEME=$(xcodebuild -list -project "$PROJ_NAME" | awk '/Schemes:/{f=1;next} f&&NF{gsub(/^[ \t]+/,""); print; exit}' | head -1)
          echo "scheme: $SCHEME"
          # App Group entitlements：付费开发者账号勾选 includes_app_group 后取消下行注释
          ENT_FLAG=""
          if [ "${{ github.event.inputs.includes_app_group }}" = "true" ]; then
            ENT_FLAG="CODE_SIGN_ENTITLEMENTS=V2D/V2D.entitlements"
          fi
          xcodebuild -project "$PROJ_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            $ENT_FLAG \
            build

      - name: 打包 IPA
        run: |
          APP=$(find .output/ios -name "*.app" -path "*Release-iphoneos*" | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry V2D-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: v2d-ios-unsigned
          path: V2D-unsigned.ipa
